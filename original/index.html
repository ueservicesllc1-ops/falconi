<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Falconi Parfums — Producto Original</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500&family=Montserrat:wght@200;300;400;500;600&display=swap" rel="stylesheet" />
  
  <style>
    :root {
      --nickel-light: #f5f5f5;
      --nickel-mid: #b5b5b5;
      --nickel-dark: #696969;
      --nickel-shadow: #333333;
    }
    
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background-color: #080808;
      background-image: radial-gradient(circle at 50% 20%, rgba(181, 181, 181, 0.15) 0%, #050505 80%);
      font-family: 'Montserrat', sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    /* Ambient particles for background */
    .ambient-light {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.05) 0%, transparent 70%);
      pointer-events: none;
      z-index: 1;
    }

    .light-1 { width: 300px; height: 300px; top: -5%; left: -10%; animation: float 8s ease-in-out infinite alternate; }
    .light-2 { width: 250px; height: 250px; bottom: 10%; right: -15%; animation: float 12s ease-in-out infinite alternate-reverse; }

    @keyframes float {
      0% { transform: translate(0, 0); }
      100% { transform: translate(40px, 40px); }
    }

    /* Mobile First Container */
    .mobile-container {
      width: 100%;
      max-width: 480px;
      padding: 2.5rem 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
      z-index: 10;
    }

    /* Rotating Nickel Coin */
    .coin-scene {
      width: 160px;
      height: 160px;
      perspective: 1200px;
      margin-bottom: 2.5rem;
      margin-top: 1rem;
    }

    .coin {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      animation: spin 4s linear infinite;
    }

    /* Coin Edges for 3D thickness */
    .coin-layer {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: var(--nickel-dark);
      box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
    }

    .coin-face {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      backface-visibility: hidden;
      background: linear-gradient(135deg, var(--nickel-light) 0%, var(--nickel-mid) 40%, var(--nickel-dark) 80%, var(--nickel-shadow) 100%);
      box-shadow: 
        inset 0 0 10px rgba(255,255,255,0.9),
        inset 0 0 35px rgba(0,0,0,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 3px solid #e0e0e0;
      overflow: hidden;
    }

    /* Engraved detail ring */
    .coin-face::after {
      content: '';
      position: absolute;
      width: 86%;
      height: 86%;
      border-radius: 50%;
      border: 1px dashed rgba(0,0,0,0.4);
      box-shadow: inset 0 0 12px rgba(0,0,0,0.4);
    }

    /* Shimmer Effect on Faces */
    .coin-face::before {
      content: '';
      position: absolute;
      top: -50%; left: -50%;
      width: 200%; height: 200%;
      background: linear-gradient(
        to right, 
        rgba(255,255,255,0) 0%, 
        rgba(255,255,255,0.6) 50%, 
        rgba(255,255,255,0) 100%
      );
      transform: rotate(45deg);
      animation: shimmer 4s linear infinite;
      pointer-events: none;
      z-index: 10;
    }

    @keyframes shimmer {
      0% { transform: rotate(45deg) translateX(-150%); }
      100% { transform: rotate(45deg) translateX(150%); }
    }

    /* Position the faces and create thickness */
    .coin-front { transform: translateZ(5px); }
    .coin-back { transform: rotateY(180deg) translateZ(5px); background: linear-gradient(135deg, var(--nickel-shadow) 0%, var(--nickel-dark) 40%, var(--nickel-mid) 80%, var(--nickel-light) 100%); }

    /* The engraved logo */
    .coin-logo {
      width: 65%;
      z-index: 2;
      /* Makes the white logo look like dark engraved metal */
      filter: invert(1) brightness(0.25) contrast(1.5) drop-shadow(0px 1px 1px rgba(255,255,255,0.7));
    }

    @keyframes spin {
      0% { transform: rotateY(0deg); }
      100% { transform: rotateY(360deg); }
    }

    /* Text Content */
    .auth-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.5rem 1.2rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 50px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--nickel-light);
      margin-bottom: 1.5rem;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      backdrop-filter: blur(5px);
    }

    .auth-badge svg {
      width: 14px;
      height: 14px;
      margin-right: 6px;
      color: #a0d4a0;
    }

    .auth-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.8rem;
      margin: 0 0 1rem 0;
      line-height: 1.1;
      background: linear-gradient(to right, #ffffff, #aaaaaa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: fadeInUp 0.8s ease-out forwards;
      opacity: 0;
    }

    .auth-desc {
      font-size: 0.95rem;
      line-height: 1.6;
      color: #999;
      margin-bottom: 2.5rem;
      animation: fadeInUp 0.8s ease-out 0.2s forwards;
      opacity: 0;
    }

    .auth-desc strong {
      color: #ddd;
      font-weight: 600;
    }

    .detail-list {
      width: 100%;
      text-align: left;
      margin-bottom: 3rem;
      animation: fadeInUp 0.8s ease-out 0.4s forwards;
      opacity: 0;
    }

    .detail-item {
      display: flex;
      align-items: center;
      padding: 1.2rem 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .detail-icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(181, 181, 181, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 1.2rem;
      color: var(--nickel-mid);
    }

    .detail-icon svg {
      width: 18px;
      height: 18px;
    }

    .detail-text h4 {
      margin: 0 0 0.3rem 0;
      font-size: 0.9rem;
      color: #eee;
      letter-spacing: 0.5px;
    }

    .detail-text p {
      margin: 0;
      font-size: 0.8rem;
      color: #777;
    }

    .btn-action {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 1.2rem;
      border-radius: 50px;
      background: linear-gradient(135deg, #2a2a2a, #111);
      border: 1px solid rgba(181, 181, 181, 0.2);
      color: #fff;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: all 0.3s;
      animation: fadeInUp 0.8s ease-out 0.6s forwards;
      opacity: 0;
      box-shadow: 0 10px 20px rgba(0,0,0,0.4);
    }

    .btn-action:active {
      transform: scale(0.97);
      background: linear-gradient(135deg, #1f1f1f, #0a0a0a);
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- Background Ambient Lights -->
  <div class="ambient-light light-1"></div>
  <div class="ambient-light light-2"></div>

  <div class="mobile-container">
    
    <!-- Rotating Nickel Coin -->
    <div class="coin-scene">
      <div class="coin">
        <!-- 3D Edges -->
        <div class="coin-layer" style="transform: translateZ(4px)"></div>
        <div class="coin-layer" style="transform: translateZ(3px)"></div>
        <div class="coin-layer" style="transform: translateZ(2px)"></div>
        <div class="coin-layer" style="transform: translateZ(1px)"></div>
        <div class="coin-layer" style="transform: translateZ(0px)"></div>
        <div class="coin-layer" style="transform: translateZ(-1px)"></div>
        <div class="coin-layer" style="transform: translateZ(-2px)"></div>
        <div class="coin-layer" style="transform: translateZ(-3px)"></div>
        <div class="coin-layer" style="transform: translateZ(-4px)"></div>
        
        <!-- Back Face -->
        <div class="coin-face coin-back">
          <img src="/LOGOBLANCO.png" alt="Falconi" class="coin-logo" onerror="this.src='../LOGOBLANCO.png'" />
        </div>
        
        <!-- Front Face -->
        <div class="coin-face coin-front">
          <img src="/LOGOBLANCO.png" alt="Falconi" class="coin-logo" onerror="this.src='../LOGOBLANCO.png'" />
        </div>
      </div>
    </div>

    <div class="auth-badge">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" stroke-width="3">
        <path d="M20 6L9 17l-5-5"></path>
      </svg>
      Verificado
    </div>
    
    <h1 class="auth-title">Auténtico</h1>
    
    <p class="auth-desc">
      Este escaneo confirma que tienes en tus manos una fragancia <strong>Falconi Parfums</strong> original.
    </p>

    <div class="detail-list">
      <div class="detail-item">
        <div class="detail-icon">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
        </div>
        <div class="detail-text">
          <h4>Calidad Premium</h4>
          <p>Ingredientes orientales certificados.</p>
        </div>
      </div>
      <div class="detail-item">
        <div class="detail-icon">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
        </div>
        <div class="detail-text">
          <h4>Seguridad Garantizada</h4>
          <p>Sello Falconi de trazabilidad intacto.</p>
        </div>
      </div>
    </div>

    <a href="/" class="btn-action">
      Descubrir Colección
      <svg style="margin-left: 8px; width: 16px; height: 16px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
    </a>

  </div>

</body>
</html>
